<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discovery First · Pipeline Design Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/lab.css">
  <style>
    .page { max-width: 1200px; margin: 0 auto; padding: 32px 24px 140px; }
    .hello h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 4.4vw, 50px); line-height: 1.05; letter-spacing: -0.02em; }
    .hello h1 em { color: var(--signal-ink); }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 28px; margin-top: 28px; align-items: start; }
    .col-title { display: flex; align-items: baseline; gap: 4px 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .col-title h2 { font-size: 16px; white-space: nowrap; }
    .rec { padding: 18px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px 16px; align-items: start; }
    .rec + .rec { margin-top: 12px; }
    .rec h3 { font-size: 17px; }
    .rec .reasons { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; }
    .rec .via { grid-column: 2 / 4; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); background: var(--bg); border-radius: 10px; padding: 8px 10px; }
    .rec .via .mini { display: flex; align-items: center; }
    .rec .via .mini .avatar { margin-left: -6px; box-shadow: 0 0 0 2px var(--bg); }
    .rec .via .mini .avatar:first-child { margin-left: 0; }
    .rec .actions { grid-column: 2 / 4; display: flex; gap: 8px; flex-wrap: wrap; }
    .score { text-align: right; }
    .score b { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; display: block; line-height: 1; }
    .score span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .breakdown { grid-column: 2 / 4; display: grid; grid-template-columns: 110px 1fr 30px; gap: 6px 10px; font-size: 12px; align-items: center; padding: 10px 12px; border: 1px dashed var(--line-2); border-radius: 10px; }
    .breakdown .bar { height: 6px; background: var(--bg-2); border-radius: 6px; overflow: hidden; }
    .breakdown .bar i { display: block; height: 100%; background: var(--ink-2); border-radius: 6px; }
    .side > .card + .card { margin-top: 16px; }
    .opp { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .opp:last-child { border-bottom: 0; }
    .opp .date { width: 52px; flex: none; font-size: 11.5px; color: var(--signal-ink); font-weight: 600; padding-top: 2px; }
    .pipe-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .pipe-row:last-child { border-bottom: 0; }
    .pipe-dot { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-weight: 700; flex: none; }
    .banner { margin-top: 18px; padding: 12px 14px; border-radius: 12px; background: var(--signal-soft); color: var(--signal-ink); display: flex; gap: 10px; align-items: center; font-size: 13px; }
    .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; user-select: none; }
    .switch input { display: none; }
    .switch .track { width: 34px; height: 20px; border-radius: 20px; background: var(--line-2); position: relative; transition: background .2s; }
    .switch .track::after { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: transform .2s var(--ease); box-shadow: var(--shadow-1); }
    .switch input:checked + .track { background: var(--ink); }
    .switch input:checked + .track::after { transform: translateX(14px); }
    .search-wrap { position: relative; width: min(440px, 100%); }
    .search-pop { position: absolute; top: 50px; left: 0; right: 0; z-index: 20; max-height: 420px; overflow-y: auto; padding: 6px; }
    .res { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 11px; cursor: pointer; }
    .res:hover { background: var(--bg); }
    .res .meta { flex: 1; min-width: 0; }
    .res .meta p { font-size: 12.5px; color: var(--muted); }
    .res .why { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .res .why .tag { height: 20px; font-size: 11px; }
    .deg { font-size: 11px; color: var(--muted); }
    .group-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 10px 10px 4px; }
    /* Explore view */
    .explore { display: grid; grid-template-columns: 400px 1fr; gap: 24px; margin-top: 18px; align-items: start; }
    .explore .profile-card { padding: 6px 22px 10px; }
    .explore-grid { position: sticky; top: 16px; }
    .explore-grid .canvas { height: 520px; border-radius: var(--radius); border: 1px solid var(--line); }
    .explore-grid .caption { display: flex; flex-wrap: wrap; gap: 14px; padding: 12px 4px; }
    .grow { margin-top: 14px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; }
    @media (max-width: 960px) {
      .layout, .explore { grid-template-columns: minmax(0, 1fr); }
      .page { padding: 24px 14px 140px; }
      .rec { grid-template-columns: auto minmax(0, 1fr) auto; padding: 14px; }
      .rec .reasons, .rec .via, .rec .actions, .rec .breakdown { grid-column: 1 / 4; }
      .rec .via { flex-wrap: wrap; }
      .explore-grid { position: static; }
      .explore-grid .canvas { height: 380px; }
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <main class="page" id="app"></main>
  <script type="module" src="js/concept-b.js"></script>
</body>
</html>
